[pytest]
# Один запуск: python -m pytest  (или scripts/test.sh)
testpaths = tests
pythonpath = .
addopts = -q -ra --timeout=90 --timeout-method=thread -m "not models" -p no:cacheprovider
markers =
    models: медленный тест с настоящими моделями (YOLO/EasyOCR) на реальных кадрах; по умолчанию пропускается
